<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Begrepsmodell for statistikkproduksjon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaeae8;
  --papir:#f4f3f0;
  --blekk:#1e1e1c;
  --dempet:#6a655d;
  --svak:#95908a;
  --hår:#d0cdc7;
  --hår-sterk:#b8b3ab;
  /* lag-farger */
  --l-meta:#7a6b5c;
  --l-mandat:#2f6b3f;
  --l-objekt:#2f7580;
  --l-beskrivelse:#3f5c8a;
  --l-data:#1c3a5c;
  --l-prosess:#a15c2b;
  --l-produkt:#c94d3a;
  --l-kvalitet:#b58824;
  --l-metadata:#6d4a8a;
  --l-roller:#b1416e;
  --l-plattform:#46626e;
  --l-fag:#7f6ba0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--blekk);
  font-family:"Inter",system-ui,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}

.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}

header{
  padding:16px 22px 14px;border-bottom:1px solid var(--hår);
  display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--bg)}
h1{font-family:"Fraunces",serif;font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
h1 .und{color:var(--dempet);font-weight:400;margin-left:10px;font-size:14px;font-family:"Inter",sans-serif;letter-spacing:0}
.sok-boks{position:relative}
#sok{font:inherit;font-size:13px;padding:7px 12px 7px 30px;border:1px solid var(--hår-sterk);
  border-radius:2px;width:230px;background:var(--papir);color:var(--blekk)}
#sok:focus{outline:none;border-color:var(--blekk)}
#sok::placeholder{color:var(--svak)}
.sok-boks::before{content:"⌕";position:absolute;left:9px;top:50%;transform:translateY(-52%);color:var(--svak);font-size:15px}

main{display:grid;grid-template-columns:280px minmax(0,1fr) 340px;height:100%;min-height:0}

/* SPALTE 1: begrepsliste */
.liste{border-right:1px solid var(--hår);overflow-y:auto;background:var(--bg);padding:8px 0 60px}
.lag-blokk{padding:12px 22px 4px}
.lag-navn{font-family:"Fraunces",serif;font-weight:600;font-size:15px;margin:0 0 3px;display:flex;align-items:center;gap:9px;letter-spacing:-.005em}
.lag-prikk{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.lag-und{margin:0 0 6px;font-size:12px;color:var(--svak);font-style:italic}
.lag-tall{margin-left:auto;font-size:11px;color:var(--svak);font-family:"Inter",sans-serif;font-weight:400}
.term{font:inherit;font-size:13.5px;background:none;border:0;padding:2px 22px 2px 34px;
  cursor:pointer;color:var(--blekk);display:block;width:100%;text-align:left;
  line-height:1.4;position:relative}
.term:hover{background:rgba(0,0,0,.04)}
.term.utvidet{color:var(--dempet)}
.term.valgt{color:#fff;font-weight:600}
.term::before{content:"";position:absolute;left:22px;top:12px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.term.valgt::before{opacity:1}

/* SPALTE 2: scene */
.scene{position:relative;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drar{cursor:grabbing}
.overlegg{position:absolute;top:14px;left:14px;font-size:11px;color:var(--svak);
  letter-spacing:.06em;text-transform:uppercase;pointer-events:none;font-weight:500}
.tegnforklaring{position:absolute;bottom:14px;left:14px;background:rgba(234,234,232,.75);
  backdrop-filter:blur(4px);border:1px solid var(--hår);padding:8px 11px;font-size:11px;
  border-radius:2px;max-width:290px;color:var(--dempet);line-height:1.35}
.tegnforklaring b{color:var(--blekk);font-weight:500}
.kontroller{position:absolute;bottom:14px;right:14px;display:flex;gap:6px}
.kontroller button{font:inherit;font-size:11px;padding:5px 9px;border:1px solid var(--hår-sterk);
  background:var(--papir);color:var(--dempet);cursor:pointer;border-radius:2px;letter-spacing:.03em}
.kontroller button:hover{color:var(--blekk);border-color:var(--blekk)}

/* SPALTE 3: detalj */
.detalj{border-left:1px solid var(--hår);overflow-y:auto;background:var(--bg);padding:22px 22px 60px}
.detalj-tom{color:var(--svak);font-size:13px;font-style:italic;padding-top:24px}
.d-lag{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.d-lag .lag-prikk{width:8px;height:8px}
.d-term{font-family:"Fraunces",serif;font-weight:600;font-size:26px;line-height:1.15;margin:0 0 14px;letter-spacing:-.015em}
.d-def{margin:0;font-size:14.5px;line-height:1.55;color:var(--blekk)}
.d-meta{margin-top:18px;padding-top:14px;border-top:1px solid var(--hår);font-size:12px;color:var(--dempet)}
.d-meta dt{font-weight:500;color:var(--blekk);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;margin-top:11px}
.d-meta dt:first-child{margin-top:0}
.d-meta dd{margin:3px 0 0}
.hopp{font:inherit;font-size:13px;background:none;border:0;padding:2px 0;color:var(--blekk);
  cursor:pointer;display:block;text-align:left;border-bottom:1px solid transparent}
.hopp:hover{border-bottom-color:currentColor}
.hopp .pil{color:var(--svak);margin-right:5px}

/* mobil */
@media (max-width:960px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto auto}
  .scene{min-height:340px;height:44vh}
  .liste{display:none}
  .detalj{border-left:0;border-top:1px solid var(--hår);max-height:46vh}
  header{grid-template-columns:1fr}
  #sok{width:100%}
}

/* stemning-farger for lag i css-var-form */
.l-meta{color:var(--l-meta)} .l-mandat{color:var(--l-mandat)} .l-objekt{color:var(--l-objekt)}
.l-beskrivelse{color:var(--l-beskrivelse)} .l-data{color:var(--l-data)} .l-prosess{color:var(--l-prosess)}
.l-produkt{color:var(--l-produkt)} .l-kvalitet{color:var(--l-kvalitet)} .l-metadata{color:var(--l-metadata)}
.l-roller{color:var(--l-roller)} .l-plattform{color:var(--l-plattform)} .l-fag{color:var(--l-fag)}
.term.l-meta.valgt{background:var(--l-meta)} .term.l-mandat.valgt{background:var(--l-mandat)}
.term.l-objekt.valgt{background:var(--l-objekt)} .term.l-beskrivelse.valgt{background:var(--l-beskrivelse)}
.term.l-data.valgt{background:var(--l-data)} .term.l-prosess.valgt{background:var(--l-prosess)}
.term.l-produkt.valgt{background:var(--l-produkt)} .term.l-kvalitet.valgt{background:var(--l-kvalitet)}
.term.l-metadata.valgt{background:var(--l-metadata)} .term.l-roller.valgt{background:var(--l-roller)}
.term.l-plattform.valgt{background:var(--l-plattform)} .term.l-fag.valgt{background:var(--l-fag)}

.lag-prikk.l-meta{background:var(--l-meta)} .lag-prikk.l-mandat{background:var(--l-mandat)}
.lag-prikk.l-objekt{background:var(--l-objekt)} .lag-prikk.l-beskrivelse{background:var(--l-beskrivelse)}
.lag-prikk.l-data{background:var(--l-data)} .lag-prikk.l-prosess{background:var(--l-prosess)}
.lag-prikk.l-produkt{background:var(--l-produkt)} .lag-prikk.l-kvalitet{background:var(--l-kvalitet)}
.lag-prikk.l-metadata{background:var(--l-metadata)} .lag-prikk.l-roller{background:var(--l-roller)}
.lag-prikk.l-plattform{background:var(--l-plattform)} .lag-prikk.l-fag{background:var(--l-fag)}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Begrepsmodell for statistikkproduksjon <span class="und">155 begreper i 12 lag</span></h1>
  <div class="sok-boks"><input id="sok" type="search" placeholder="Søk"></div>
</header>
<main>

  <div class="scene">

    <div class="overlegg">Dra for å rotere · rull for å zoome · klikk en node</div>
    <div class="tegnforklaring" id="tegn"></div>
    <div class="kontroller">
      <button id="knapp-utv" aria-pressed="false">Vis utvidede</button>
      <button id="knapp-nullstill">Nullstill</button>
    </div>
  </div>
  <aside class="detalj" id="detalj"></aside>
</main>
</div>

hvor":""},{"id":"kommune","t":"kommune","lag":"objekt","gruppe":"Avgrensning i tid og rom","k":0,"f":2,"d":"Den administrative geografiske enheten mest statistikk publiseres på. Endres ved sammenslåing, og skaper da brudd.","par":[],"hvor":""},{"id":"grunnkrets","t":"grunnkrets","lag":"objekt","gruppe":"Avgrensning i tid og rom","k":0,"f":2,"d":"Den minste faste geografiske enheten vi publiserer på, og byggeklossen for større inndelinger.","par":[],"hvor":""},{"id":"variabel","t":"variabel","lag":"beskrivelse","gruppe":"Variabel","k":1,"f":2,"d":"En egenskap ved enheten som vi måler, med et definert sett mulige verdier.","par":["variabeldefinisjon"],"hvor":""},{"id":"variabeldefinisjon","t":"variabeldefinisjon","lag":"beskrivelse","gruppe":"Variabel","k":1,"f":2,"d":"Den forvaltede beskrivelsen av hva en variabel betyr, uavhengig av hvilket datasett eller hvilken tabell den brukes i.","par":["variabel"],"hvor":"Forvaltes i VarDef"},{"id":"verdi","t":"verdi","lag":"beskrivelse","gruppe":"Variabel","k":1,"f":2,"d":"Den konkrete observasjonen for én variabel på én enhet.","par":[],"hvor":""},{"id":"manglende-verdi","t":"manglende verdi","lag":"beskrivelse","gruppe":"Variabel","k":1,"f":4,"d":"At observasjonen ikke finnes. Skal vises som manglende, ikke fylles stille — brukeren har krav på å vite forskjellen på målt og beregnet.","par":[],"hvor":""},{"id":"maalenhet","t":"målenhet","lag":"beskrivelse","gruppe":"Variabel","k":0,"f":2,"d":"Enheten verdien uttrykkes i: kroner, personer, tonn, prosent, årsverk.","par":[],"hvor":""},{"id":"avledet-variabel","t":"avledet variabel","lag":"beskrivelse","gruppe":"Variabel","k":0,"f":4,"d":"Variabel beregnet ut fra andre variabler, ikke observert direkte. Arver usikkerheten fra alle den er bygget på.","par":[],"hvor":""},{"id":"klassifikasjon","t":"klassifikasjon","lag":"beskrivelse","gruppe":"Klassifikasjon","k":1,"f":2,"d":"Et fullstendig og gjensidig utelukkende sett kategorier som enheter eller verdier plasseres i.","par":["k ","lag":"prosess","gruppe":"Faser","k":1,"f":3,"d":"Å hente inn data fra registre, kilder eller oppgavegivere.","par":[],"hvor":""},{"id":"bearbeiding","t":"bearbeiding","lag":"prosess","gruppe":"Faser","k":1,"f":4,"d":"Å gjøre innsamlede data om til klargjorte data: editering, koding, imputering, vekting.","par":[],"hvor":""},{"id":"analyse","t":"analyse","lag":"prosess","gruppe":"Faser","k":1,"f":4,"d":"Å tolke tallene, vurdere rimelighet, forklare avvik og bestemme hva som kan publiseres.","par":[],"hvor":""},{"id":"formidling","t":"formidling","lag":"prosess","gruppe":"Faser","k":1,"f":5,"d":"Å publisere tallene og gjøre dem forståelige for dem som skal bruke dem.","par":[],"hvor":""},{"id":"evaluering","t":"evaluering","lag":"prosess","gruppe":"Faser","k":1,"f":6,"d":"Å vurdere hva som gikk galt og hva som bør endres neste runde. Lukker sløyfa tilbake til behov.","par":[],"hvor":""},{"id":"editering","t":"editering","lag":"prosess","gruppe":"Bearbeidingssteg","k":1,"f":4,"d":"Å finne og rette feil og urimeligheter i innsamlede data, maskinelt eller manuelt.","par":[],"hvor":""},{"id":"imputering","t":"imputering","lag":"prosess","gruppe":"Bearbeidingssteg","k":1,"f":4,"d":"Å beregne en verdi der observasjonen mangler. Skal alltid merkes, slik at brukeren vet hva som er målt og hva som er utfylt.","par":[],"hvor":""},{"id":"koding","t":"koding","lag":"prosess","gruppe":"Bearbeidingssteg","k":0,"f":4,"d":"Å plassere en observasjon i riktig kategori i en klassifikasjon.","par":[],"hvor":""},{"id":"vekting","t":"vekting","lag":"prosess","gruppe":"Bearbeidingssteg","k":0,"f":4,"d":"Å la hver utvalgsenhet representere et bestemt antall enheter i populasjonen.","par":[],"hvor":""},{"id":"estimering","t":"estimering","lag":"prosess","gruppe":"Bearbeidingssteg","k":0,"f":4,"d":"Å beregne tall for hele populasjonen ut fra et utvalg, med tilhørende usikkerhet.","par":[],"hvor":""},{"id":"sesongjustering","t":"sesongjustering","lag":"prosess","gruppe":"Justering av serier" :"gruppe","w":0.35},{"a":"sdmx","b":"ddi","type":"gruppe","w":0.35},{"a":"statistikkansvarlig","b":"dataeier","type":"gruppe","w":0.35},{"a":"dataeier","b":"prosesseier","type":"gruppe","w":0.35},{"a":"prosesseier","b":"metodeansvarlig","type":"gruppe","w":0.35},{"a":"oppgavegiver","b":"bruker","type":"gruppe","w":0.35},{"a":"bruker","b":"databehandler","type":"gruppe","w":0.35},{"a":"databehandler","b":"personvernombud","type":"gruppe","w":0.35},{"a":"dapla","b":"klass","type":"gruppe","w":0.35},{"a":"klass","b":"vardef","type":"gruppe","w":0.35},{"a":"vardef","b":"microdata","type":"gruppe","w":0.35},{"a":"sysselsatt","b":"arbeidsledig","type":"gruppe","w":0.35},{"a":"kpi","b":"bnp","type":"gruppe","w":0.35}],"lag":[{"id":"meta","navn":"Begrepslaget","und":"grammatikken for resten","fag":0},{"id":"mandat","navn":"Mandat","und":"hvorfor vi teller","fag":0},{"id":"objekt","navn":"Objekt","und":"hva statistikken handler om","fag":0},{"id":"beskrivelse","navn":"Beskrivelse","und":"hvordan vi måler","fag":0},{"id":"data","navn":"Data","und":"hva vi håndterer","fag":0},{"id":"prosess","navn":"Prosess","und":"hvordan det lages","fag":0},{"id":"produkt","navn":"Produkt","und":"hva vi leverer","fag":0},{"id":"kvalitet","navn":"Kvalitet","und":"tverrgående","fag":0},{"id":"metadata","navn":"Metadata","und":"tverrgående","fag":0},{"id":"roller","navn":"Roller","und":"tverrgående","fag":0},{"id":"plattform","navn":"Plattform","und":"tverrgående","fag":0},{"id":"fag","navn":"Fagbegreper","und":"eksempler på apparatet i bruk","fag":1}],"faser":[{"n":1,"navn":"Rammer og oppdrag","und":"hvorfor vi i det hele tatt teller"},{"n":2,"navn":"Utforming","und":"hva vi skal måle, og på hvem"},{"n":3,"navn":"Innsamling","und":"å skaffe data"},{"n":4,"navn":"Bearbeiding","und":"fra kildedata til tall"},{"n":5,"navn":"Publisering","und":"ut i verden"},{"n":6,"navn":"Forvaltning","und":"det som må bestå etterpå"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const ROWS = DATA.rows, EDGES = DATA.edges, LAG = DATA.lag, FASER = DATA.faser;
const KART = {}; ROWS.forEach(r => KART[r.id] = r);
const LAGKART = {}; LAG.forEach(l => LAGKART[l.id] = l);

const state = {valgt:null, sok:"", utvidet:false, over:null};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 3D graf ---------- */

const canvas = $("graf");
const ctx = canvas.getContext("2d");
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0;

// noder i 3D
const NODER = ROWS.map((r, i) => {
  // start posisjoner i en kule
  const phi = Math.acos(1 - 2 * (i + 0.5) / ROWS.length);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  const R = 260;
  return {
    id: r.id, r: r, lag: r.lag, k: r.k,
    x: R * Math.sin(phi) * Math.cos(theta),
    y: R * Math.sin(phi) * Math.sin(theta),
    z: R * Math.cos(phi),
    vx:0, vy:0, vz:0,
    px:0, py:0, pz:0, pr:0  // screen projection
  };
});
const NIX = {}; NODER.forEach(n => NIX[n.id] = n);

// kanter refererer noder etter indeks (rask)
const KANTER = EDGES.map(e => ({a:NIX[e.a], b:NIX[e.b], type:e.type, w:e.w})).filter(e => e.a && e.b);

// rotasjon
let angY = 0.3, angX = -0.15;
let mål_angY = angY, mål_angX = angX;
let autoRot = true;
let zoom = 1;

// simulering
let alpha = 1;

function simuler(){
  // frastøt (O(n^2), 155 noder → 12k par per steg — greit)
  const N = NODER.length;
  for(let i = 0; i < N; i++){
    const a = NODER[i];
    for(let j = i + 1; j < N; j++){
      const b = NODER[j];
      let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      let d2 = dx*dx + dy*dy + dz*dz;
      if(d2 < 0.01) d2 = 0.01;
      const d = Math.sqrt(d2);
      const f = 900 / d2;
      dx /= d; dy /= d; dz /= d;
      a.vx -= dx * f; a.vy -= dy * f; a.vz -= dz * f;
      b.vx += dx * f; b.vy += dy * f; b.vz += dz * f;
      // hard kollisjon
      const min = 14;
      if(d < min){
        const push = (min - d) * 0.5;
        a.vx -= dx * push; a.vy -= dy * push; a.vz -= dz * push;
        b.vx += dx * push; b.vy += dy * push; b.vz += dz * push;
      }
    }
  }
  // fjærer langs kanter
  KANTER.forEach(k => {
    let dx = k.b.x - k.a.x, dy = k.b.y - k.a.y, dz = k.b.z - k.a.z;
    const d = Math.sqrt(dx*dx + dy*dy + dz*dz) || 0.01;
    const mål = k.type === "par" ? 44 : k.type === "ref" ? 78 : 55;
    const f = (d - mål) * 0.015 * k.w;
    dx /= d; dy /= d; dz /= d;
    k.a.vx += dx * f; k.a.vy += dy * f; k.a.vz += dz * f;
    k.b.vx -= dx * f; k.b.vy -= dy * f; k.b.vz -= dz * f;
  });
  // svak sentrering + demping + integrer
  NODER.forEach(n => {
    n.vx += -n.x * 0.002; n.vy += -n.y * 0.002; n.vz += -n.z * 0.002;
    n.vx *= 0.78; n.vy *= 0.78; n.vz *= 0.78;
    n.x += n.vx * alpha; n.y += n.vy * alpha; n.z += n.vz * alpha;
  });
  alpha = Math.max(0.05, alpha * 0.99);
}

// varm opp
for(let i = 0; i < 220; i++) simuler();
alpha = 0.25;

/* ---------- projeksjon og tegning ---------- */

function projiser(){
  const cy = Math.cos(angY), sy = Math.sin(angY);
  const cx = Math.cos(angX), sx = Math.sin(angX);
  const persp = 700;
  const cx0 = W / 2, cy0 = H / 2;
  const zoomEff = zoom * Math.min(W, H) / 700;
  for(const n of NODER){
    // rotate Y
    let x = n.x * cy + n.z * sy;
    let z = -n.x * sy + n.z * cy;
    // rotate X
    let y = n.y * cx - z * sx;
    z = n.y * sx + z * cx;
    // perspektiv
    const s = persp / (persp + z);
    n.px = cx0 + x * s * zoomEff;
    n.py = cy0 + y * s * zoomEff;
    n.pz = z;
    n.pr = (3.4 + (n.k ? 1.6 : 0)) * s * zoomEff;
  }
}

function fargeAv(id){
  const cs = getComputedStyle(document.documentElement);
  return cs.getPropertyValue("--l-" + id).trim() || "#666";
}
const LAGFARGE = {}; LAG.forEach(l => LAGFARGE[l.id] = fargeAv(l.id));

function tegn(){
  if(!ctx || !W) return;
  ctx.clearRect(0, 0, W, H);
  projiser();

  const fokus = state.valgt || state.over;
  const naboer = new Set();
  if(fokus){
    naboer.add(fokus);
    KANTER.forEach(k => {
      if(k.a.id === fokus) naboer.add(k.b.id);
      if(k.b.id === fokus) naboer.add(k.a.id);
    });
  }

  // kanter — sortert etter dybde bakerst-først
  const sortKanter = [...KANTER].sort((a,b) => (a.a.pz + a.b.pz) - (b.a.pz + b.b.pz));
  sortKanter.forEach(k => {
    if(!state.utvidet && (!k.a.k || !k.b.k) && k.type !== "par") return;
    const zSnitt = (k.a.pz + k.b.pz) / 2;
    let alpha = Math.max(0.06, 0.35 - zSnitt * 0.0009);
    const relatert = fokus && (naboer.has(k.a.id) && naboer.has(k.b.id));
    if(fokus && !relatert) alpha *= 0.12;
    if(relatert) alpha = 0.9;
    let farge = k.type === "par" ? "#8a4b21" : "#89857e";
    if(relatert && k.type === "par") farge = "#c96a2e";
    ctx.strokeStyle = farge;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = k.type === "par" ? 1.4 : k.type === "ref" ? 0.7 : 0.5;
    ctx.beginPath();
    ctx.moveTo(k.a.px, k.a.py);
    ctx.lineTo(k.b.px, k.b.py);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // noder — bakerst først
  const sortNoder = [...NODER].sort((a,b) => b.pz - a.pz);
  sortNoder.forEach(n => {
    if(!state.utvidet && !n.k) return;
    if(state.sok && !passer(n.r)) return;
    const farge = LAGFARGE[n.lag];
    const erValgt = n.id === state.valgt;
    const erOver = n.id === state.over;
    let alpha = Math.max(0.35, 1 - n.pz * 0.0018);
    if(fokus && !naboer.has(n.id)) alpha *= 0.28;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = farge;
    ctx.beginPath();
    ctx.arc(n.px, n.py, n.pr, 0, Math.PI * 2);
    ctx.fill();
    if(erValgt || erOver){
      ctx.strokeStyle = "#1e1e1c";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  // etiketter — bare valgt, over, og naboer
  ctx.font = '500 12px "Inter",sans-serif';
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  NODER.forEach(n => {
    if(!state.utvidet && !n.k) return;
    const vis = n.id === state.valgt || n.id === state.over || (fokus && naboer.has(n.id));
    if(!vis) return;
    const tekst = n.r.t;
    const x = n.px + n.pr + 6, y = n.py;
    // hvit ramme rundt
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(234,234,232,.9)";
    ctx.strokeText(tekst, x, y);
    ctx.fillStyle = n.id === state.valgt ? LAGFARGE[n.lag] : "#1e1e1c";
    ctx.fillText(tekst, x, y);
  });
}

/* ---------- animasjonsløkke ---------- */

let løper = false;
function løkke(){
  løper = true;
  // rotasjon-glidning
  angY += (mål_angY - angY) * 0.12;
  angX += (mål_angX - angX) * 0.12;
  if(autoRot && !state.over && !state.valgt) mål_angY += 0.0018;
  simuler();
  tegn();
  const aktiv = alpha > 0.06 || Math.abs(mål_angY - angY) > 0.001 || Math.abs(mål_angX - angX) > 0.001 || (autoRot && !state.over && !state.valgt);
  if(aktiv) requestAnimationFrame(løkke);
  else løper = false;
}
function vekk(){ if(!løper) requestAnimationFrame(løkke); }

/* ---------- interaksjon ---------- */

let drar = false, dragX = 0, dragY = 0, harFlyttet = false;

canvas.addEventListener("pointerdown", e => {
  drar = true; harFlyttet = false;
  dragX = e.clientX; dragY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add("drar");
  autoRot = false;
});
canvas.addEventListener("pointermove", e => {
  if(drar){
    const dx = e.clientX - dragX, dy = e.clientY - dragY;
    if(Math.abs(dx) + Math.abs(dy) > 3) harFlyttet = true;
    mål_angY += dx * 0.007;
    mål_angX = Math.max(-1.2, Math.min(1.2, mål_angX + dy * 0.007));
    dragX = e.clientX; dragY = e.clientY;
    alpha = Math.max(alpha, 0.1);
    vekk();
  } else {
    const n = plukk(e);
    const nyOver = n ? n.id : null;
    if(nyOver !== state.over){ state.over = nyOver; canvas.style.cursor = n ? "pointer" : "grab"; vekk(); }
  }
});
canvas.addEventListener("pointerup", e => {
  canvas.classList.remove("drar");
  if(drar && !harFlyttet){
    const n = plukk(e);
    velg(n ? n.id : null);
  }
  drar = false;
});
canvas.addEventListener("pointerleave", () => { drar = false; canvas.classList.remove("drar"); });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  zoom = Math.max(0.4, Math.min(3, zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
  alpha = Math.max(alpha, 0.08);
  vekk();
}, {passive:false});

function plukk(e){
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  let treff = null, avstand = 12;
  for(const n of NODER){
    if(!state.utvidet && !n.k) continue;
    const dx = n.px - x, dy = n.py - y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(d < Math.max(n.pr + 4, avstand) && (!treff || n.pz < treff.pz)){ treff = n; avstand = d; }
  }
  return treff;
}

/* ---------- liste og detalj ---------- */

function passer(r){
  const q = state.sok.trim().toLowerCase();
  if(!q) return true;
  return (r.t + " " + r.d).toLowerCase().includes(q);
}

function tegnListe(){
  let h = "";
  LAG.forEach(l => {
    const rader = ROWS.filter(r => r.lag === l.id && (state.utvidet || r.k) && passer(r));
    if(!rader.length) return;
    h += '<div class="lag-blokk" id="lag-' + l.id + '">';
    h += '<h2 class="lag-navn"><span class="lag-prikk l-' + l.id + '"></span>' + esc(l.navn);
    h += '<span class="lag-tall">' + rader.length + '</span></h2>';
    h += '<p class="lag-und">' + esc(l.und) + '</p>';
    rader.forEach(r => {
      h += '<button class="term l-' + l.id + (r.k ? "" : " utvidet") + (r.id === state.valgt ? " valgt" : "") +
        '" data-id="' + r.id + '">' + esc(r.t) + '</button>';
    });
    h += '</div>';
  });
  $("liste").innerHTML = h || '<div class="lag-blokk"><p class="lag-und" style="font-style:normal">Ingen begreper passer søket.</p></div>';
}

function tegnDetalj(){
  const d = $("detalj");
  if(!state.valgt){
    d.innerHTML = '<p class="detalj-tom">Velg et begrep — fra listen, eller ved å klikke en node i grafen.</p>';
    return;
  }
  const r = KART[state.valgt];
  const l = LAGKART[r.lag];
  let h = '<p class="d-lag"><span class="lag-prikk l-' + l.id + '"></span><span class="l-' + l.id + '">' + esc(l.navn) + '</span>';
  h += ' <span style="color:var(--svak);font-weight:400"> &rsaquo; ' + esc(r.gruppe) + (r.k ? "" : " &middot; utvidet") + '</span></p>';
  h += '<h2 class="d-term">' + esc(r.t) + '</h2>';
  h += '<p class="d-def">' + esc(r.d) + '</p>';
  const rel = EDGES.filter(e => (e.a === r.id || e.b === r.id));
  const par = rel.filter(e => e.type === "par").map(e => e.a === r.id ? e.b : e.a);
  const ref = rel.filter(e => e.type === "ref");
  if(par.length || r.f || r.hvor || ref.length){
    h += '<dl class="d-meta">';
    if(par.length){
      h += '<dt>Ikke det samme som</dt><dd>';
      par.forEach(p => { if(KART[p]) h += '<button class="hopp" data-id="' + p + '"><span class="pil">→</span>' + esc(KART[p].t) + '</button>'; });
      h += '</dd>';
    }
    if(r.f){ const fa = FASER.find(x => x.n === r.f);
      h += '<dt>Møter deg i</dt><dd>' + fa.n + '. ' + esc(fa.navn) + '</dd>'; }
    if(r.hvor) h += '<dt>Forvaltes</dt><dd>' + esc(r.hvor) + '</dd>';
    if(ref.length){
      const inn = ref.filter(e => e.b === r.id).map(e => e.a);
      const ut = ref.filter(e => e.a === r.id).map(e => e.b);
      if(ut.length){
        h += '<dt>Låner fra</dt><dd>';
        ut.slice(0,8).forEach(p => { if(KART[p]) h += '<button class="hopp" data-id="' + p + '"><span class="pil">→</span>' + esc(KART[p].t) + '</button>'; });
        h += '</dd>';
      }
      if(inn.length){
        h += '<dt>Nevnes i</dt><dd>';
        inn.slice(0,8).forEach(p => { if(KART[p]) h += '<button class="hopp" data-id="' + p + '"><span class="pil">←</span>' + esc(KART[p].t) + '</button>'; });
        h += '</dd>';
      }
    }
    h += '</dl>';
  }
  d.innerHTML = h;
}

function tegnTegn(){
  const antKjerne = ROWS.filter(r => r.k).length;
  $("tegn").innerHTML =
    '<b>' + (state.utvidet ? ROWS.length : antKjerne) + ' begreper</b> · farge = lag<br>' +
    '<span style="color:#8a4b21">━</span> forvirringspar &nbsp; ' +
    '<span style="color:#89857e">━</span> tekstreferanse';
}

/* ---------- valg og navigasjon ---------- */

function velg(id){
  if(id && !state.utvidet && !KART[id].k){
    state.utvidet = true; $("knapp-utv").setAttribute("aria-pressed", "true"); $("knapp-utv").textContent = "Skjul utvidede";
  }
  state.valgt = id;
  tegnListe(); tegnDetalj(); vekk();
  if(id){
    // rull til rad i listen
    const el = $("liste").querySelector('.term[data-id="' + id + '"]');
    if(el && el.scrollIntoView) el.scrollIntoView({block:"nearest", behavior:"smooth"});
    // sett hash for deling
    history.replaceState(null, "", "#" + id);
  } else {
    history.replaceState(null, "", "#");
  }
}

$("liste").addEventListener("click", e => {
  const b = e.target.closest(".term");
  if(b) velg(b.dataset.id);
});
$("detalj").addEventListener("click", e => {
  const h = e.target.closest(".hopp");
  if(h) velg(h.dataset.id);
});
$("sok").addEventListener("input", e => {
  state.sok = e.target.value;
  tegnListe(); vekk();
});
$("knapp-utv").addEventListener("click", () => {
  state.utvidet = !state.utvidet;
  $("knapp-utv").setAttribute("aria-pressed", state.utvidet);
  $("knapp-utv").textContent = state.utvidet ? "Skjul utvidede" : "Vis utvidede";
  tegnListe(); tegnTegn(); vekk();
});
$("knapp-nullstill").addEventListener("click", () => {
  state.valgt = null; state.sok = ""; $("sok").value = "";
  zoom = 1; mål_angY = 0.3; mål_angX = -0.15; autoRot = true;
  tegnListe(); tegnDetalj(); vekk();
});

// åpning fra hash
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if(KART[id] && id !== state.valgt) velg(id);
});

function resize(){
  const rect = canvas.getBoundingClientRect();
  W = rect.width; H = rect.height;
  canvas.width = W * DPR; canvas.height = H * DPR;
  if(ctx && ctx.setTransform) ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vekk();
}
window.addEventListener("resize", resize);

tegnListe();
tegnDetalj();
tegnTegn();
resize();
if(location.hash){
  const id = location.hash.slice(1);
  if(KART[id]) velg(id);
}
vekk();
</script>
</body>
</html>
